{% extends "base.html" %}
{% block content %}
<div class="top-container">
    <div class="panel" style="border-color: {{ FONT_COLOR }};">
        <div class="panel-header" style="background-color: {{ FONT_COLOR }}; color: {{ FONT_COLOR2 }};">被動技能能變更</div>
        <div class="panel-body">
            <form action="{{ url_for('status.dispatch') }}" method="post">
                <input type="hidden" name="mode" value="sk_set2">
                <table style="width:100%; font-size:0.8rem;">
                    <tr><th>欄位</th><th>被動技能能</th></tr>
                    {% for i in range(2) %}
                    <tr>
                        <td>欄位{{ i + 1 }}</td>
                        <td>
                            <select name="sk{{ i + 1 }}" style="width:100%;">
                                <option value="0">（無）</option>
                                {% for ab in abilities %}
                                <option value="{{ ab.id }}" {% if current[i] is defined and ab.id == current[i] %}selected{% endif %}>{{ ab.name }}（{{ ab.description }}）</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">變更</button>
            </form>
        </div>
    </div>
    <a href="{{ url_for('main.top') }}" class="btn btn-primary">返回</a>
</div>
{% endblock %}
