{% extends "base.html" %}
{% block content %}
<div class="top-container">
    <div class="panel" style="border-color: {{ FONT_COLOR }};">
        <div class="panel-header" style="background-color: {{ FONT_COLOR }}; color: {{ FONT_COLOR2 }};">類型變更</div>
        <div class="panel-body">
            <p style="font-size:0.8rem;">目前的類型： {{ JOB_TYPES.get(char.job_type, '不明') }}</p>
            <form action="{{ url_for('status.dispatch') }}" method="post">
                <input type="hidden" name="mode" value="type_change2">
                <table style="width:100%; font-size:0.8rem;">
                    <tr><th></th><th>類型名稱</th></tr>
                    {% for type_id, type_name in JOB_TYPES.items() %}
                    <tr>
                        <td><input type="radio" name="job_type" value="{{ type_id }}" {% if type_id == char.job_type %}checked{% endif %}></td>
                        <td>{{ type_name }}</td>
                    </tr>
                    {% endfor %}
                </table>
                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">變更</button>
            </form>
        </div>
    </div>
    <a href="{{ url_for('main.top') }}" class="btn btn-primary">返回</a>
</div>
{% endblock %}
