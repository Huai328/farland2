{% extends "base.html" %}
{% block content %}
<div class="top-container">
    <div class="panel" style="border-color: {{ ELEMENT_BG[char.element] }};">
        <div class="panel-header" style="background-color: {{ ELEMENT_BG[char.element] }}; color: {{ ELEMENT_FG[char.element] }};">
            道具使用/裝備
        </div>
        <div class="panel-body">
            {% if items %}
            <form action="{{ url_for('status.dispatch') }}" method="post">
                <input type="hidden" name="mode" value="equip2">
                <table style="width: 100%; font-size: 0.8rem;">
                    <tr><th></th><th>名稱</th><th>種類</th><th>威力</th><th>重量</th><th>售價</th></tr>
                    {% for item in items %}
                    <tr>
                        <td><input type="radio" name="item_id" value="{{ item.id }}"></td>
                        <td>{{ item.name }}</td>
                        <td>{{ item.category }}</td>
                        <td>{{ item.power }}</td>
                        <td>{{ item.weight }}</td>
                        <td>{{ item.price // 2 }}G</td>
                    </tr>
                    {% endfor %}
                </table>
                <div style="margin-top: 0.5rem; display: flex; gap: 0.5rem;">
                    <button type="submit" class="btn btn-primary">使用/裝備</button>
                </div>
            </form>
            <form action="{{ url_for('town.dispatch') }}" method="post" style="margin-top: 0.5rem;">
                <input type="hidden" name="mode" value="sell">
                <input type="hidden" name="item_id" value="">
                <p style="font-size: 0.75rem; color: #888;">出售請至城鎮的商店進行。</p>
            </form>
            {% else %}
            <p>目前沒有道具。</p>
            {% endif %}
        </div>
    </div>
    <a href="{{ url_for('main.top') }}" class="btn btn-primary">返回</a>
</div>
{% endblock %}
