{% extends "base.html" %}
{% block content %}
<div class="top-container">
    <div class="panel" style="border-color: {{ FONT_COLOR }};">
        <div class="panel-header" style="background-color: {{ FONT_COLOR }}; color: {{ FONT_COLOR2 }};">職業變更</div>
        <div class="panel-body">
            <form action="{{ url_for('status.dispatch') }}" method="post">
                <input type="hidden" name="mode" value="change2">
                <div class="shop-table-wrap">
                    <table class="shop-table">
                        <thead>
                            <tr>
                                <th class="radio-col"></th>
                                <th>職業名</th>
                                <th>條件</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for job in available_jobs %}
                            <tr>
                                <td class="radio-col">
                                    {% if job.can_change %}
                                    <input type="radio" name="job_id" value="{{ job.id }}">
                                    {% else %}
                                    <span style="color:red; font-size:0.75rem;">未達</span>
                                    {% endif %}
                                </td>
                                <td {% if not job.can_change %}style="color:#888;" {% endif %}>{{ job.name }}</td>
                                <td style="font-size:0.75rem; {% if not job.can_change %}color:#888;{% endif %}">{{
                                    job.requirements or '—' }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">轉職</button>
            </form>
        </div>
    </div>
    <a href="{{ url_for('main.top') }}" class="btn btn-primary">返回</a>
</div>
{% endblock %}
