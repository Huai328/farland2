{% extends "base.html" %}
{% block content %}
<div class="top-container">
    <div class="panel" style="border-color: {{ FONT_COLOR }};">
        <div class="panel-header" style="background-color: {{ FONT_COLOR }}; color: {{ FONT_COLOR2 }};">寄送道具</div>
        <div class="panel-body">
            <p style="font-size:0.8rem;">寄送手續費：100,000G（由銀行扣款）</p>
            <p style="font-size:0.8rem;">銀行餘額: {{ char.bank }}G</p>
            <form action="{{ url_for('status.dispatch') }}" method="post">
                <input type="hidden" name="mode" value="item_send2">
                <table style="width:100%; font-size:0.8rem;">
                    <tr>
                        <td>收件人</td>
                        <td>
                            <select name="target_id" style="width:100%;">
                                <option value="">請選擇</option>
                                {% for p in players %}
                                <option value="{{ p.id }}">{{ p.name }}（LV{{ p.level }}）</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                </table>
                <h4 style="font-size:0.85rem; margin-top:0.5rem;">選擇道具</h4>
                <table style="width:100%; font-size:0.8rem;">
                    <tr><th></th><th>名稱</th><th>種類</th><th>威力量</th></tr>
                    {% for item in items %}
                    <tr>
                        <td><input type="radio" name="item_id" value="{{ item.id }}"></td>
                        <td>{{ item.name }}</td>
                        <td>{{ item.category }}</td>
                        <td>{{ item.power }}</td>
                    </tr>
                    {% endfor %}
                </table>
                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">寄送</button>
            </form>
        </div>
    </div>
    <a href="{{ url_for('main.top') }}" class="btn btn-primary">返回</a>
</div>
{% endblock %}
