{% extends "base.html" %}
{% block content %}
<div class="top-container">
    <div class="panel" style="border-color: {{ FONT_COLOR }};">
        <div class="panel-header" style="background-color: {{ FONT_COLOR }}; color: {{ FONT_COLOR2 }};">匯款</div>
        <div class="panel-body">
            <p style="font-size:0.8rem;">銀行餘額: {{ char.bank }}G</p>
            <form action="{{ url_for('status.dispatch') }}" method="post">
                <input type="hidden" name="mode" value="money_send2">
                <table style="width:100%; font-size:0.8rem;">
                    <tr>
                        <td>匯款對象</td>
                        <td>
                            <select name="target_id" style="width:100%;">
                                <option value="">請選擇</option>
                                {% for p in players %}
                                <option value="{{ p.id }}">{{ p.name }}（LV{{ p.level }}）</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>金額</td>
                        <td><input type="number" name="amount" min="10000" step="10000" style="width:120px;">G（以 10000 為單位）</td>
                    </tr>
                </table>
                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">匯款</button>
            </form>
        </div>
    </div>
    <a href="{{ url_for('main.top') }}" class="btn btn-primary">返回</a>
</div>
{% endblock %}
