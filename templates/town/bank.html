{% extends "base.html" %}
{% block content %}
<div class="top-container">
    <div class="panel" style="border-color: {{ FONT_COLOR }};">
        <div class="panel-header" style="background-color: {{ FONT_COLOR }}; color: {{ FONT_COLOR2 }};">銀行</div>
        <div class="panel-body">
            <table style="font-size:0.8rem; width:100%;">
                <tr><td>持有金</td><td style="text-align:right;">{{ char.gold }}G</td></tr>
                <tr><td>銀行餘額</td><td style="text-align:right;">{{ char.bank }}G</td></tr>
            </table>
            <hr>
            <div style="display:flex; flex-direction:column; gap:0.5rem;">
                <form action="{{ url_for('town.dispatch') }}" method="post" style="display:flex; gap:0.5rem; align-items:center;">
                    <input type="hidden" name="mode" value="banka">
                    <input type="number" name="amount" min="1" placeholder="以萬為單位" style="width:80px; font-size:0.8rem;">
                    <span style="font-size:0.75rem;">萬G</span>
                    <button type="submit" class="btn btn-primary" style="font-size:0.8rem;">存款</button>
                </form>
                <form action="{{ url_for('town.dispatch') }}" method="post" style="display:flex; gap:0.5rem; align-items:center;">
                    <input type="hidden" name="mode" value="bankh">
                    <input type="number" name="amount" min="1" placeholder="以萬為單位" style="width:80px; font-size:0.8rem;">
                    <span style="font-size:0.75rem;">萬G</span>
                    <button type="submit" class="btn btn-secondary" style="font-size:0.8rem;">提款</button>
                </form>
                <form action="{{ url_for('town.dispatch') }}" method="post">
                    <input type="hidden" name="mode" value="bankall">
                    <button type="submit" class="btn btn-primary" style="font-size:0.8rem;">全額存款</button>
                </form>
            </div>
        </div>
    </div>
    <a href="{{ url_for('main.top') }}" class="btn btn-primary">返回</a>
</div>
{% endblock %}
