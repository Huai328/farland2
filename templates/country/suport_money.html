{% extends "base.html" %}
{% block content %}
<div class="top-container">
    <div class="panel" style="border-color: {{ FONT_COLOR }};">
        <div class="panel-header" style="background-color: #993300; color: #ffffcc;">國庫援助</div>
        <div class="panel-body">
            <p style="font-size:0.8rem;">{{ country.name }}國進行資金援助。<br>
            根據援助金額，國家貢獻度會提升。<br>
            目前國庫：{{ country.gold }}G</p>
            <form action="{{ url_for('country.dispatch') }}" method="post">
                <input type="hidden" name="mode" value="suport_money2">
                <input type="number" name="gold" min="1" style="width:80px;"> ×10000G
                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">援助</button>
            </form>
        </div>
    </div>
    <a href="{{ url_for('main.top') }}" class="btn btn-primary">返回</a>
</div>
{% endblock %}
